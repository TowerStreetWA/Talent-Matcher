openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VacancyMatch AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and sessions
  - name: candidates
    description: Candidate management
  - name: matches
    description: Vacancy matching
  - name: jobs
    description: Job market data
  - name: jobSources
    description: Job source registry
  - name: alerts
    description: Alert rules
  - name: dashboard
    description: Dashboard summaries
  - name: admin
    description: Audit and compliance
  - name: team
    description: Team and invite management
  - name: research
    description: External vacancy page research (Firecrawl)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and revoke the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new workspace and owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "200":
          description: Workspace created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/invite:
    get:
      operationId: lookupInvite
      tags: [auth]
      summary: Look up a pending invite by token
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Invalid, expired, or already used invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /auth/accept-invite:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Accept an invite and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteInput"
      responses:
        "200":
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input or invite no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List members of the current workspace
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /team/{userId}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Change a member's role or status
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamMemberInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Invalid change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /team/invites:
    get:
      operationId: listInvites
      tags: [team]
      summary: List pending invites
      responses:
        "200":
          description: Pending invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamInvite"
    post:
      operationId: createInvite
      tags: [team]
      summary: Invite a teammate by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteInput"
      responses:
        "200":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "409":
          description: Email already in use or already invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /team/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [team]
      summary: Revoke a pending invite
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Invite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List available billing plans with prices
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPlan"
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Get the current tenant's billing state
      responses:
        "200":
          description: Billing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingState"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Stripe Checkout session for a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrl"
        "400":
          description: Invalid plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe Customer Portal session
      responses:
        "200":
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingUrl"
        "400":
          description: No billing customer yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: debug
          in: query
          required: false
          description: When "1", include per-result searchDebug ranking metadata (dev/internal)
          schema: { type: string }
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
    post:
      operationId: createCandidate
      tags: [candidates]
      summary: Create a candidate manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
  /candidates/upload-cv:
    post:
      operationId: uploadCv
      tags: [candidates]
      summary: Upload a CV and create a parsed candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvUploadInput"
      responses:
        "201":
          description: Parsed candidate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          description: Parse failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for a CV file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /candidates/{id}/cv-file:
    get:
      operationId: downloadCandidateCvFile
      tags: [candidates]
      summary: Download the original uploaded CV file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The original CV file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    patch:
      operationId: updateCandidate
      tags: [candidates]
      summary: Update a candidate profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdate"
      responses:
        "200":
          description: Updated candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteCandidate
      tags: [candidates]
      summary: Delete a candidate and their data
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /candidates/{id}/run-match:
    post:
      operationId: runMatch
      tags: [matches]
      summary: Run a live market match for a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Match run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /candidates/{id}/matches:
    get:
      operationId: listCandidateMatches
      tags: [matches]
      summary: List matches for a candidate (latest run)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Matches ranked by score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /candidates/{id}/match-runs:
    get:
      operationId: listMatchRuns
      tags: [matches]
      summary: List match run history for a candidate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Match runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchRun"
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List all matches across candidates
      parameters:
        - name: recruiterStatus
          in: query
          required: false
          schema: { type: string }
        - name: minScore
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /matches/{id}:
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update recruiter decision on a match (shortlist, dismiss, note)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /matches/{id}/push-to-crm:
    post:
      operationId: pushMatchToCrm
      tags: [matches]
      summary: Push a match to the connected CRM
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmPushInput"
      responses:
        "201":
          description: CRM sync event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmSyncEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Search normalized live jobs
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: sourceId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: debug
          in: query
          required: false
          description: When "1", include per-result searchDebug ranking metadata (dev/internal)
          schema: { type: string }
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /search/suggestions:
    get:
      operationId: listSearchSuggestions
      tags: [search]
      summary: Ranked search suggestions for a scope
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [candidates, jobs] }
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchSuggestion"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /job-sources:
    get:
      operationId: listJobSources
      tags: [jobSources]
      summary: List job sources with health info
      responses:
        "200":
          description: Job sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSource"
    post:
      operationId: createJobSource
      tags: [jobSources]
      summary: Register a job source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSource"
  /job-sources/{id}:
    patch:
      operationId: updateJobSource
      tags: [jobSources]
      summary: Update a job source (enable/disable)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSourceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSource"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /alert-rules:
    get:
      operationId: listAlertRules
      tags: [alerts]
      summary: List alert rules (watchlist)
      responses:
        "200":
          description: Alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertRule"
    post:
      operationId: createAlertRule
      tags: [alerts]
      summary: Create an alert rule for a candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
  /alert-rules/{id}:
    patch:
      operationId: updateAlertRule
      tags: [alerts]
      summary: Update an alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertRuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertRule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
    delete:
      operationId: deleteAlertRule
      tags: [alerts]
      summary: Delete an alert rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard overview stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /dashboard/top-matches:
    get:
      operationId: getTopMatches
      tags: [dashboard]
      summary: Top new matches across all candidates
      responses:
        "200":
          description: Top matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /crm-sync-events:
    get:
      operationId: listCrmSyncEvents
      tags: [admin]
      summary: List CRM sync events
      responses:
        "200":
          description: Sync events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmSyncEvent"
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: List audit logs
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /research/scrape-url:
    post:
      operationId: scrapeResearchUrl
      tags: [research]
      summary: Scrape a single external vacancy URL into clean markdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchUrlInput"
      responses:
        "200":
          description: Scraped page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapedPage"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Upstream scrape failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Firecrawl not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /research/extract-job:
    post:
      operationId: extractResearchJob
      tags: [research]
      summary: Extract structured job data from an external vacancy URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchUrlInput"
      responses:
        "200":
          description: Extracted job fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedJob"
        "400":
          description: Invalid or blocked URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Upstream extraction failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Firecrawl not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /research/company:
    get:
      operationId: searchResearchCompanies
      tags: [research]
      summary: Search UK companies by name (Companies House)
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 160 }
      responses:
        "200":
          description: Matching companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanySearchResult"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "429":
          description: Companies House rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Companies House not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
  /research/company/{companyNumber}:
    get:
      operationId: getResearchCompanyProfile
      tags: [research]
      summary: UK company profile by company number (Companies House)
      parameters:
        - name: companyNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          description: Invalid company number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "429":
          description: Companies House rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "502":
          description: Upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
        "503":
          description: Companies House not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMessage"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SearchSuggestion:
      type: object
      required: [label, kind]
      properties:
        label:
          type: string
        kind:
          type: string
          enum: [title, company, skill]
    ApiMessage:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ResearchUrlInput:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1, maxLength: 2048 }
    ScrapedPageMetadata:
      type: object
      required: [sourceUrl]
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        siteName: { type: string, nullable: true }
        language: { type: string, nullable: true }
        statusCode: { type: number, nullable: true }
        sourceUrl: { type: string }
    ScrapedPage:
      type: object
      required: [success, metadata, markdown, contentPreview]
      properties:
        success: { type: boolean }
        metadata:
          $ref: "#/components/schemas/ScrapedPageMetadata"
        markdown: { type: string }
        contentPreview: { type: string }
    ExtractedJob:
      type: object
      required: [skills, sourceUrl]
      properties:
        title: { type: string, nullable: true }
        company: { type: string, nullable: true }
        location: { type: string, nullable: true }
        salaryText: { type: string, nullable: true }
        contractType: { type: string, nullable: true }
        description: { type: string, nullable: true }
        skills:
          type: array
          items: { type: string }
        experienceLevel: { type: string, nullable: true }
        remoteType: { type: string, nullable: true }
        sourceUrl: { type: string }
        confidenceNotes: { type: string, nullable: true }
    CompanySearchResult:
      type: object
      required: [companyNumber, name]
      properties:
        companyNumber: { type: string }
        name: { type: string }
        status: { type: string, nullable: true }
        companyType: { type: string, nullable: true }
        incorporationDate: { type: string, nullable: true }
        addressSnippet: { type: string, nullable: true }
    CompanySicCode:
      type: object
      required: [code, description]
      properties:
        code: { type: string }
        description: { type: string }
    CompanyProfile:
      type: object
      required: [companyNumber, name, sicCodes]
      properties:
        companyNumber: { type: string }
        name: { type: string }
        status: { type: string, nullable: true }
        companyType: { type: string, nullable: true }
        jurisdiction: { type: string, nullable: true }
        incorporationDate: { type: string, nullable: true }
        sicCodes:
          type: array
          items:
            $ref: "#/components/schemas/CompanySicCode"
        registeredOfficeLocality: { type: string, nullable: true }
        lastAccountsDate: { type: string, nullable: true }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    AuthUser:
      type: object
      required: [id, tenantId, tenantName, email, fullName, role]
      properties:
        id: { type: string }
        tenantId: { type: string }
        tenantName: { type: string }
        email: { type: string }
        fullName: { type: string }
        role:
          type: string
          enum: [owner, admin, recruiter, viewer]
    SignupInput:
      type: object
      required: [companyName, fullName, email, password]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 80 }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, minLength: 3 }
        password: { type: string, minLength: 8, maxLength: 200 }
    InvitePreview:
      type: object
      required: [email, role, tenantName, invitedByName]
      properties:
        email: { type: string }
        role:
          type: string
          enum: [admin, recruiter, viewer]
        tenantName: { type: string }
        invitedByName: { type: string }
    AcceptInviteInput:
      type: object
      required: [token, fullName, password]
      properties:
        token: { type: string, minLength: 1 }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, minLength: 8, maxLength: 200 }
    TeamMember:
      type: object
      required: [id, email, fullName, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        role:
          type: string

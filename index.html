<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Try a live demo of a trades business website and AI owner portal: AI chat, enquiries pipeline, AI quotes, follow-ups, jobs, calendar and invoicing. By Tower Street Web &amp; Apps.">
<meta property="og:title" content="Redway Building Services — live demo">
<meta property="og:description" content="Click through a real website and AI-powered owner portal built for trades. No login needed.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1B2530">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Redway Building Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --surface-2:#F5F6F7; --sunk:#E4E7EA;
  --ink:#17202A; --ink-2:#4B5663; --ink-3:#7A8491; --line:#D6DBE0;
  --brick:#B3372A; --brick-hi:#9A2C21; --brick-soft:#F7E4E1; --on-brick:#FFFFFF;
  --slate:#1B2530; --slate-2:#243140; --on-slate:#E7ECF0; --on-slate-2:#98A5B3;
  --hivis:#E0A100; --hivis-soft:#FBF1D4;
  --ok:#1E7F55; --ok-soft:#DDF1E7; --warn:#A86A00; --warn-soft:#FBEDD0; --bad:#B4231A; --bad-soft:#FADCD9;
  --info:#2B5C9E; --info-soft:#DDE8F6; --violet:#6B4FB0; --violet-soft:#ECE6F7;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.08);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E141A; --surface:#161E27; --surface-2:#1B2530; --sunk:#111820;
  --ink:#E6EBF0; --ink-2:#A4B0BC; --ink-3:#77838F; --line:#2A3643;
  --brick:#DE5A48; --brick-hi:#EA7060; --brick-soft:#3A1E1A; --on-brick:#FFFFFF;
  --slate:#0A0F14; --slate-2:#141C25; --on-slate:#E6EBF0; --on-slate-2:#8793A0;
  --hivis:#F0B72A; --hivis-soft:#3A2F10;
  --ok:#4CC08A; --ok-soft:#153325; --warn:#E3A73A; --warn-soft:#3A2B10; --bad:#F07368; --bad-soft:#3B1916;
  --info:#7FA8E6; --info-soft:#18283D; --violet:#A98DEB; --violet-soft:#261D3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --surface:#161E27; --surface-2:#1B2530; --sunk:#111820;
  --ink:#E6EBF0; --ink-2:#A4B0BC; --ink-3:#77838F; --line:#2A3643;
  --brick:#DE5A48; --brick-hi:#EA7060; --brick-soft:#3A1E1A; --on-brick:#FFFFFF;
  --slate:#0A0F14; --slate-2:#141C25; --on-slate:#E6EBF0; --on-slate-2:#8793A0;
  --hivis:#F0B72A; --hivis-soft:#3A2F10;
  --ok:#4CC08A; --ok-soft:#153325; --warn:#E3A73A; --warn-soft:#3A2B10; --bad:#F07368; --bad-soft:#3B1916;
  --info:#7FA8E6; --info-soft:#18283D; --violet:#A98DEB; --violet-soft:#261D3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:.005em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brick);border-color:var(--brick);color:var(--on-brick)}
.btn.primary:hover{background:var(--brick-hi);border-color:var(--brick-hi)}
.btn.ai{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ai:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.55;cursor:default}
.btn .spark{width:14px;height:14px}
.btn.busy{position:relative;color:transparent!important}
.btn.busy::after{content:"Thinking…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-ai{background:var(--violet-soft);color:var(--violet)}
.p-neutral{background:var(--sunk);color:var(--ink-2)}
.p-brick{background:var(--brick-soft);color:var(--brick)}

/* Demo bar */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--slate);color:var(--on-slate);border-bottom:1px solid rgba(255,255,255,.06)}
.demobar .in{display:flex;align-items:center;gap:12px;padding-block:8px;padding-inline:16px;flex-wrap:wrap}
.demotag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;background:var(--hivis);color:#1A1400;padding:3px 8px;border-radius:4px;font-weight:500}
.demobar .dnote{color:var(--on-slate-2);font-size:12.5px;flex:1;min-width:160px}
.seg{display:inline-flex;background:var(--slate-2);border-radius:7px;padding:3px}
.seg button{border:0;background:transparent;color:var(--on-slate-2);padding:6px 12px;border-radius:5px;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.demobar .btn{background:transparent;color:var(--on-slate);border-color:rgba(255,255,255,.18)}
.demobar .btn:hover{border-color:rgba(255,255,255,.4)}
.demobar .btn.tour{background:var(--hivis);color:#1A1400;border-color:var(--hivis)}

/* ============ WEBSITE ============ */
.wrap{max-width:1160px;margin-inline:auto;padding-inline:max(16px,3vw)}
.site{background:var(--surface)}
.snav{border-bottom:1px solid var(--line);background:var(--surface)}
.snav .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-top:3px}
.brand svg{flex:none}
.snav nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.snav nav a{color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:5px;font-weight:500;cursor:pointer}
.snav nav a:hover{color:var(--ink);background:var(--surface-2)}
.snav .phone{font-family:var(--mono);font-size:13px;color:var(--ink-2)}

.hero{position:relative;overflow:hidden;background:var(--slate);color:var(--on-slate)}
.hero::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding-block:64px 56px;align-items:center}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--hivis);text-transform:uppercase}
.hero h1{font-size:clamp(44px,6.4vw,82px);text-transform:uppercase;margin-top:14px;letter-spacing:.005em}
.hero h1 em{font-style:normal;color:var(--brick)}
:root[data-theme="dark"] .hero h1 em{color:var(--brick)}
.hero p.lead{font-size:17px;color:var(--on-slate-2);max-width:52ch;margin-top:18px}
.hero .ctas{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.hero .btn{font-size:15px;padding:11px 18px}
.hero .btn.outline{background:transparent;color:var(--on-slate);border-color:rgba(255,255,255,.28)}
.hero .facts{display:flex;gap:28px;margin-top:34px;flex-wrap:wrap}
.hero .facts div{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.hero .facts span{display:block;font-family:var(--sans);font-size:12px;color:var(--on-slate-2);margin-top:6px;font-weight:400}
.plan{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:18px;max-width:100%}
.plan .ptop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--on-slate-2);margin-bottom:10px}
.plan svg{width:100%;height:auto;display:block}

.strip{background:var(--hivis);color:#1A1400}
.strip .wrap{display:flex;gap:10px 28px;padding-block:12px;flex-wrap:wrap;font-weight:600;font-size:13px}
.strip span{display:flex;align-items:center;gap:8px}
.strip span::before{content:"";width:7px;height:7px;background:#1A1400;transform:rotate(45deg)}

.sec{padding-block:64px}
.sec.alt{background:var(--surface-2)}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.sechead h2{font-size:clamp(32px,4vw,46px);text-transform:uppercase}
.sechead p{max-width:48ch;color:var(--ink-2)}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.svc{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:10px}
.svc .ic{width:40px;height:40px;border-radius:8px;background:var(--brick-soft);color:var(--brick);display:grid;place-items:center}
.svc h3{font-size:24px;text-transform:uppercase}
.svc p{color:var(--ink-2);font-size:14px}
.svc .from{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.proj .draw{background:var(--slate);aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;position:relative}
.proj .draw svg{width:82%;height:auto}
.proj .draw .tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:10.5px;color:var(--hivis);letter-spacing:.06em}
.proj .meta{padding:14px 16px;display:grid;gap:4px}
.proj h4{font-size:20px;text-transform:uppercase}
.proj .row{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.stars{color:var(--hivis);letter-spacing:2px;font-size:15px}
.rev p{font-size:15px}
.rev .who{margin-top:auto;font-size:13px;color:var(--ink-2)}
.contact{display:grid;grid-template-columns:1.2fr .8fr;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.form{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;font-size:14px}
.field textarea{resize:vertical;min-height:90px}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brick);outline-offset:-1px;border-color:transparent}
.cinfo{padding:24px;display:grid;gap:18px;align-content:start}
.cinfo .k{font-size:12px;color:var(--ink-3)}
.cinfo .v{font-weight:500}
.sfoot{background:var(--slate);color:var(--on-slate-2);font-size:13px}
.sfoot .wrap{display:flex;justify-content:space-between;gap:16px;padding-block:24px;flex-wrap:wrap}

/* chat widget */
.chatfab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;background:var(--brick);color:var(--on-brick);border:0;border-radius:99px;padding:12px 18px 12px 14px;font-weight:600;box-shadow:var(--shadow)}
.chat{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:55;width:min(370px,calc(100vw - 36px));height:min(520px,calc(100vh - 170px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.chat header{background:var(--slate);color:var(--on-slate);padding:12px 14px;display:flex;align-items:center;gap:10px}
.chat header .dot{width:8px;height:8px;border-radius:50%;background:#4CC08A}
.chat header b{font-weight:600}
.chat header small{display:block;color:var(--on-slate-2);font-size:11.5px}
.chat header button{margin-left:auto;background:transparent;border:0;color:var(--on-slate);font-size:20px;line-height:1}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.bub{max-width:85%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.bub.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--brick);color:var(--on-brick);align-self:flex-end;border-bottom-right-radius:4px}
.bub.sys{align-self:center;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:600;border-radius:99px;padding:5px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--brick);color:var(--brick)}
.chat form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--surface)}
.chat form input{flex:1;border:1px solid var(--line);border-radius:99px;padding:9px 14px;background:var(--surface)}
.typing{display:inline-flex;gap:3px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

/* ============ PORTAL ============ */
.portal{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 50px)}
.side{background:var(--slate);color:var(--on-slate);padding:18px 12px;position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.side .brand{color:var(--on-slate);padding:0 8px;font-size:20px}
.side .brand small{color:var(--on-slate-2)}
.ngroup{display:grid;gap:2px}
.ngroup .label{color:var(--on-slate-2);padding:0 10px 4px;font-size:10.5px}
.nitem{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--on-slate-2);padding:8px 10px;border-radius:6px;text-align:left;font-weight:500;font-size:13.5px;width:100%}
.nitem svg{width:17px;height:17px;flex:none;opacity:.85}
.nitem:hover{background:var(--slate-2);color:var(--on-slate)}
.nitem[aria-current="page"]{background:var(--slate-2);color:#fff;box-shadow:inset 3px 0 0 var(--brick)}
.nitem .ai{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;background:rgba(169,141,235,.18);color:#C4B2F2;padding:1px 6px;border-radius:4px}
.nitem .ct{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--brick);color:#fff;border-radius:99px;padding:0 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:32px;height:32px;border-radius:50%;background:var(--hivis);color:#1A1400;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.side .me small{display:block;color:var(--on-slate-2);font-size:11.5px}
.main{padding:22px max(16px,2.4vw) 60px;min-width:0}
.phead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.phead h1{font-size:34px;text-transform:uppercase}
.phead .sub{color:var(--ink-2);margin-top:4px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.ph h3{font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:0}
.panel>.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel>.pb{padding:16px}
.kpi{padding:16px;display:grid;gap:6px}
.kpi .v{font-family:var(--display);font-size:36px;font-weight:600;line-height:1}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.kpi .d b{color:var(--ok);font-weight:600}
.aicard{border:1px solid color-mix(in srgb,var(--violet) 35%,var(--line));background:linear-gradient(180deg,var(--violet-soft),var(--surface) 70%)}
.ins{display:grid;gap:0}
.ins>div{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ins>div:first-child{border-top:0}
.ins .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ins .t{flex:1;min-width:0}
.ins .t b{display:block;font-weight:600;font-size:13.5px}
.ins .t span{font-size:12.5px;color:var(--ink-2)}
.list>div{display:flex;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.when{font-family:var(--mono);font-size:12px;color:var(--ink-2);width:74px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* table */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t tbody tr:hover{background:var(--surface-2)}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sunk);border-radius:10px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--brick);outline-offset:-2px}
.col .ch{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
.col .ch b{font-weight:600;font-size:13px}
.col .ch .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.col .ch .sum{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:grid;gap:5px;cursor:pointer;text-align:left;width:100%}
.ecard:hover{border-color:var(--ink-3)}
.ecard .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ecard b{font-weight:600;font-size:13.5px}
.ecard .val{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.ecard .job{font-size:12.5px;color:var(--ink-2)}
.ecard .foot{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.ecard.new{animation:pop .6s ease}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--hivis)}40%{box-shadow:0 0 0 4px var(--hivis)}100%{box-shadow:0 0 0 0 transparent}}
.src{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);z-index:71;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{font-size:28px;text-transform:uppercase}
.drawer header button{margin-left:auto}
.drawer .body{padding:18px 20px;overflow-y:auto;display:grid;gap:16px;align-content:start}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.drawer .acts{display:flex;gap:8px;flex-wrap:wrap}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13.5px}

/* wizard */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--line)}
.step{border:0;background:transparent;padding:14px 16px;text-align:left;display:flex;gap:10px;align-items:center;border-bottom:3px solid transparent;color:var(--ink-3)}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--mono);font-size:12px;flex:none}
.step b{display:block;font-weight:600;font-size:13.5px;color:inherit}
.step small{display:block;font-size:11.5px}
.step.on{color:var(--ink);border-bottom-color:var(--brick)}
.step.on .n{background:var(--brick);border-color:var(--brick);color:#fff}
.step.done{color:var(--ink-2)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.wbody{padding:20px}
.items input{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:5px;width:100%;font-size:13.5px}
.items input:hover{border-color:var(--line)}
.items input:focus{border-color:var(--brick);outline:none;background:var(--surface)}
.items input.n{text-align:right;font-family:var(--mono);font-size:13px}
.items td{padding:4px 8px}
.totals{display:grid;grid-template-columns:auto 120px;gap:6px 20px;justify-content:end;padding:14px 16px;font-size:13.5px}
.totals .g{font-family:var(--display);font-size:26px;font-weight:700}
.wfoot{display:flex;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.aiempty{border:1.5px dashed color-mix(in srgb,var(--violet) 45%,var(--line));border-radius:10px;padding:28px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--violet-soft)}
.aiempty p{max-width:52ch;color:var(--ink-2)}
.typed{white-space:pre-wrap}
.caret::after{content:"▍";color:var(--violet);animation:bl .8s infinite}

/* document */
.doc{background:#FFFFFF;color:#17202A;border:1px solid var(--line);border-radius:6px;padding:28px;font-size:13px;box-shadow:var(--shadow);max-width:760px}
.doc .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #B3372A;padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
.doc .dh .brand small{color:#7A8491}
.doc .dh .brand{color:#17202A}
.doc h2{font-size:30px;text-transform:uppercase;color:#B3372A}
.doc .meta{font-family:var(--mono);font-size:11.5px;color:#4B5663;text-align:right;line-height:1.7}
.doc .to{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.doc .to .label{color:#7A8491}
.doc table{width:100%;border-collapse:collapse;margin:14px 0}
.doc th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#7A8491;border-bottom:1px solid #D6DBE0;padding:7px 6px}
.doc td{padding:7px 6px;border-bottom:1px solid #EEF0F2}
.doc .r{text-align:right;font-variant-numeric:tabular-nums}
.doc .tot{display:grid;grid-template-columns:auto 110px;gap:4px 18px;justify-content:end;font-variant-numeric:tabular-nums}
.doc .tot .g{font-weight:700;font-size:16px;border-top:2px solid #17202A;padding-top:5px}
.doc .foot{margin-top:18px;padding-top:12px;border-top:1px solid #D6DBE0;font-size:11.5px;color:#4B5663;display:grid;gap:4px}
.doc p{margin:0 0 10px}
.doc .scope{white-space:pre-wrap}
.email{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.email .eh{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;display:grid;gap:3px;background:var(--surface-2)}
.email .eh span{color:var(--ink-3);display:inline-block;width:56px}
.email .eb{padding:14px;white-space:pre-wrap;font-size:13.5px}

/* jobs */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.job{padding:16px;display:grid;gap:10px;align-content:start}
.job .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job h4{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:0}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brick);border-radius:99px}
.bar.ok i{background:var(--ok)}
.job .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);gap:10px}
.crew{display:flex}
.crew span{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
.crew span:first-child{margin-left:0}
.nexttask{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:8px 10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{padding:8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal .day{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:var(--surface-2)}
.cal .day.out .dn{color:var(--ink-3)}
.cal .dn{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.cal .day.today .dn{background:var(--brick);color:#fff;border-radius:4px;padding:0 6px;align-self:flex-start}
.ev{font-size:11.5px;border-radius:4px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.ev.visit{background:var(--info-soft);color:var(--info)}
.ev.job{background:var(--brick-soft);color:var(--brick)}
.ev.follow{background:var(--violet-soft);color:var(--violet)}
.ev.other{background:var(--warn-soft);color:var(--warn)}
.ev span{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* import */
.wa{background:#E6DED3;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:230px}
:root[data-theme="dark"] .wa{background:#0B141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#0B141A}}
.wa .m{background:var(--surface);border-radius:8px;border-top-left-radius:2px;padding:7px 10px;font-size:13.5px;max-width:88%;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap}
.wa .m small{display:block;text-align:right;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.wa .from{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:6px;font-size:12.5px;color:var(--ink-2)}
.tab[aria-pressed="true"]{border-color:var(--brick);color:var(--brick);background:var(--brick-soft)}
.xf{display:grid;gap:0}
.xf>div{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px}
.xf>div:first-child{border-top:0}
.xf .k{color:var(--ink-3);font-size:12.5px}
.xf .v{font-weight:500}
.xf .v.empty{color:var(--ink-3);font-weight:400}
.conf{font-family:var(--mono);font-size:10.5px;color:var(--ok)}
.conf.lo{color:var(--warn)}
.reveal{animation:rv .35s ease both}
@keyframes rv{from{background:var(--violet-soft)}to{background:transparent}}

/* writer */
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:99px;font-size:12.5px;color:var(--ink-2)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.out{min-height:240px;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.55}
.out.wa-style{background:var(--surface-2)}

/* content */
.suggest{display:grid;gap:8px;margin-top:10px}
.suggest button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;line-height:1.1}
.suggest button:hover{border-color:var(--violet);color:var(--violet)}
.mini{background:var(--slate);color:var(--on-slate);border-radius:8px;padding:22px;display:grid;gap:10px}
.mini h3{font-size:34px;text-transform:uppercase;line-height:1}
.mini h3 em{font-style:normal;color:var(--brick)}
.mini p{color:var(--on-slate-2);font-size:13.5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.switch:first-child{border-top:0}
.tog{width:38px;height:22px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);position:relative;flex:none;padding:0}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tog[aria-pressed="true"]::after{left:18px}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:min(440px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:13.5px;animation:tin .25s ease}
.toast button{margin-left:auto;background:transparent;border:1px solid color-mix(in srgb,var(--surface) 40%,transparent);color:var(--surface);border-radius:5px;padding:4px 9px;font-size:12.5px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* tour */
.tour-hl{position:fixed;z-index:95;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,15,20,.62),0 0 0 3px var(--hivis);pointer-events:none;transition:all .3s ease}
.tour-tip{position:fixed;z-index:96;width:min(360px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:18px;display:grid;gap:10px;border-top:4px solid var(--hivis)}
.tour-tip .c{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tour-tip h3{font-size:26px;text-transform:uppercase}
.tour-tip p{color:var(--ink-2);font-size:14px}
.tour-tip .nav{display:flex;gap:8px;align-items:center}
.tour-tip .nav .sp{flex:1}
.tour-block{position:fixed;inset:0;z-index:94}

@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3-2{grid-template-columns:1fr}
  .services,.projects,.reviews{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .portal{grid-template-columns:1fr}
  .side{position:sticky;top:50px;z-index:40;height:auto;flex-direction:row;padding:8px 12px;overflow-x:auto;gap:4px;align-items:center}
  .side .brand,.side .me,.ngroup .label{display:none}
  .ngroup{display:flex;gap:2px}
  .nitem{width:auto;white-space:nowrap;padding:7px 10px}
  .nitem[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--brick)}
  .hero .wrap,.contact{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(4,minmax(120px,1fr));overflow-x:auto}
}
@media (max-width:600px){
  .services,.projects,.reviews,.form{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:28px}
  .demobar .dnote{display:none}
  .xf>div{grid-template-columns:96px 1fr}
  .xf .conf{display:none}
  .cal .day{min-height:70px}
  .cal .ev{font-size:10px;padding:1px 3px}
  .doc{padding:18px}
  .doc .to{grid-template-columns:1fr}
  .snav .phone{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 if(f==="town"){d.town=txt.trim();S.chat.flow="job";return "Last one: what work do you need? A sentence or two is plenty.";}
 if(f==="job"){
  d.note=txt.trim();S.chat.flow=null;
  const job=guessJob(d.note+" "+(d.topic||""))||"Kitchen extension";
  const parts=d.name.split(" ");
  const e={id:nid(),first:parts[0],last:parts.slice(1).join(" ")||"",town:d.town,pc:"",job,source:"AI chat",stage:"New",value:(T[job]?sumItems(itemsFor(job)).net:5000),date:D(0),note:d.note,phone:d.phone,email:"",fresh:true};

  return `Perfect, that's with the team now. Dave or Lee will call you within one working day to arrange a free site visit for your ${job.toLowerCase()}.`;
 }
 if(/quote|price up|come out|visit/.test(t)&&!/how much|cost|price\b/.test(t)||/i'?d like a quote/.test(t)){S.chat.flow="name";d.topic=txt;return "Happy to arrange that. What's your name?";}
 if(/loft/.test(t)) {d.topic="loft";return "Most of our loft conversions land between £38,000 and £62,000. A Velux conversion sits at the lower end, a full dormer with en-suite at the top. They take 8–10 weeks and you can stay in the house throughout.\n\nWant me to book a free site visit so we can give you a fixed price?";}
 if(/extension|kitchen/.test(t)) {d.topic="extension";return "Single storey rear extensions typically run from £1,950 per m², so a 5m × 4m kitchen extension is usually £38,000–£48,000 depending on doors, roof lantern and finish. We manage drawings, steels and Building Control.\n\nShall I get a site visit booked?";}
 if(/electric|rewire|socket|fuse|ev|charger|consumer/.test(t)) {d.topic="electrical";return "Yes, we have our own qualified electricians. Rewires for a 3-bed semi are typically £7,500–£9,000, consumer unit upgrades from £1,050, and EV chargers from £1,190 fitted. Every job comes with certification.";}
 if(/bath|shower|en.?suite/.test(t)) {d.topic="bathroom";return "A full bathroom refit is usually £7,500–£12,000 including tiling, sanitaryware and electrics, and takes about 8–10 working days.";}
 if(/area|cover|where|essex|chelmsford|brentwood/.test(t)) return "We cover Chelmsford, Brentwood, Billericay, Basildon, Maldon, Witham, Colchester and the villages in between, roughly 25 miles from our yard in Chelmsford.";
 if(/when|available|start|how soon|wait/.test(t)) return "We're currently booking site visits within the week, and new projects are starting from about four weeks out. Emergency roof repairs are usually same or next day.";
 if(/how much|cost|price/.test(t)) return "Rough guides: bathrooms from £7,500, extensions from £1,950/m², loft conversions from £38,000, rewires from £7,500. For a fixed price we do a free site visit. Would you like one?";
 if(/^(yes|yeah|yep|sure|please|ok)/.test(t)){S.chat.flow="name";return "Great. What's your name?";}
 return "Good question. I'll make sure the team sees it. In the meantime, would you like me to arrange a free site visit so we can price it properly?";
}
function guessJob(s){s=s.toLowerCase();
 if(/loft|dormer/.test(s))return "Loft conversion";if(/extension|kitchen/.test(s))return "Kitchen extension";if(/bath|shower|en.?suite|loo\b|toilet/.test(s))return "Bathroom refit";

 const b=text.match(/£\s?\d[\d,]*(?:k)?(?:\s?-\s?£?\d[\d,]*k?)?|\d+\s?-\s?\d+k/i);if(b)r.budget={v:b[0],c:85};
 r.urgency=/asap|urgent|leak|emergency|today/i.test(text)?{v:"High",c:90}:{v:"Normal",c:70};
 const t=text.match(/(spring|summer|autumn|winter|christmas|next (?:week|month)|this week|asap)/i);if(t)r.timing={v:t[0][0].toUpperCase()+t[0].slice(1),c:82};
 return r;
}

/* ---------- AI text generators ---------- */
function writeQuote(e,items){
 const t=sumItems(items);
 const intro=`Dear ${e.first},\n\nThank you for inviting us to look at your ${e.job.toLowerCase()} in ${e.town}. Based on our discussion and your notes ("${e.note.replace(/\.$/,"")}"), we've put together a fixed price for the full job below. There are no provisional sums hiding extra costs, and the price includes all labour, materials and waste removal listed.`;
 const scope=items.map((i,n)=>`${n+1}. ${i.desc}.`).join("\n")+`\n\nA named site lead will be with you throughout, you'll get a progress update every Friday, and we leave the site clean and safe at the end of every day.`;
 const excl=`• Decoration beyond mist coat unless listed above.\n• Any works required by unforeseen ground conditions or hidden defects, which we'd always discuss and price with you before proceeding.\n• Customer-supplied items (e.g. tiles, appliances) are assumed delivered to site on time.\n• Price based on reasonable access and parking at the property.`;
 return {intro,scope,excl,total:t.gross};
}
function chaseText(q){
 const e=enqById(q.enqId);const d=-dayDiff(q.sent);
 if(d<11) return `Hi ${e.first}, it's Dave from Redway. Just checking the quote for your ${e.job.toLowerCase()} came through OK (${q.ref}). If anything's unclear or you'd like a line changed, drop me a message and I'll sort it. No rush at all.`;
 if(d<15) return `Hi ${e.first}, Dave from Redway here. I sent over the quote for your ${e.job.toLowerCase()} a couple of weeks ago. Happy to pop round again or jump on a quick call if you've got questions, or if you've had other quotes and want to talk through the differences. Just let me know what works.`;
 return `Hi ${e.first}, Dave at Redway. I'm finalising our diary for the next couple of months and I've still got a slot for your ${e.job.toLowerCase()} starting ${fmtD(D(28))}. Our quote (${q.ref}) is valid until ${fmtD(D(30-d))}. If you'd like me to hold the slot, just reply "yes" and I'll call to confirm. If the timing's not right, no problem at all.`;
}

/* ---------- typing ---------- */
async function typeInto(el,text,{speed=3}={}){
 if(!el)return;
 if(RM){el.textContent=text;return;}
 el.classList.add("caret");el.textContent="";
 let i=0;await new Promise(res=>{const step=()=>{i=Math.min(text.length,i+speed);el.textContent=text.slice(0,i);if(i<text.length)requestAnimationFrame(step);else res();};step();});
 el.classList.remove("caret");
}
async function busy(btn,ms=900){if(btn){btn.classList.add("busy");btn.disabled=true;}await sleep(RM?50:ms);}

/* ---------- toast ---------- */
function toast(msg,actLabel,fn){
 const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(msg)}</span>${actLabel?`<button>${esc(actLabel)}</button>`:""}`;
 if(actLabel)t.querySelector("button").onclick=()=>{fn();t.remove();};
 $("#toasts").appendChild(t);setTimeout(()=>t.remove(),5200);
}

 if(k2==="src"){S.srcFilter=el.value;renderView();}
 if(k2==="wizEnq"){S.wiz.enqId=+el.value;S.wiz.items=[];S.wiz.intro="";renderView();}
 if(k2==="wrTo"){if(el.value!=="c"){S.wr.to=+el.value;S.wr.custOverride=null;}S.wr.out="";renderView();}
 if(k2==="stage"){const e=enqById(el.dataset.id);const was=e.stage;e.stage=el.value;logAct(`<b>${esc(fullName(e))}</b> moved from ${was} to ${e.stage}`);renderPortal();openDrawer(e.id);toast(`Moved to ${e.stage}`);}
});
document.addEventListener("submit",ev=>{
 if(ev.target.id==="chatForm"){ev.preventDefault();const i=$("#chatIn");const v=i.value;i.value="";chatSend(v);}
 if(ev.target.id==="siteForm"){ev.preventDefault();
  const name=$("#cf-name").value.trim()||"Website visitor";const parts=name.split(" ");const job=$("#cf-job").value;
  const e={id:nid(),first:parts[0],last:parts.slice(1).join(" "),town:$("#cf-town").value.trim()||"—",pc:"",job,source:"Website",stage:"New",value:Math.round(sumItems(itemsFor(job)).net),date:D(0),note:$("#cf-msg").value.trim(),phone:$("#cf-phone").value.trim(),email:parts[0].toLowerCase()+"@example.com",fresh:true};
  S.enq.unshift(e);logAct(`<b>${esc(fullName(e))}</b> submitted a website enquiry`,"var(--info)");
  ev.target.innerHTML=`<div class="full" style="padding:20px 4px;display:grid;gap:10px"><h3 style="font-size:28px;text-transform:uppercase">Thanks ${esc(parts[0])}, we've got it.</h3><p class="muted">We'll call you within one working day to arrange a free site visit.</p><div><button class="btn primary" type="button" data-act="nav" data-view="enquiries">See it arrive in the owner portal →</button></div></div>`;
  toast("Enquiry received — it's already in the owner portal","Open portal",()=>{setMode("portal");go("enquiries");});
 }
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if(TI>=0)tourEnd();else closeDrawer();}
 if(TI>=0&&ev.key==="ArrowRight")tourGo(TI+1);if(TI>=0&&ev.key==="ArrowLeft")tourGo(TI-1);});

/* ---------- guided tour ---------- */
const TOUR=[
 {mode:"site",sel:"#t-hero",title:"Your new website",text:"This is what customers see: a fast, mobile-friendly site for a local building firm. Headline, services and wording are all editable from the owner portal."},
 {mode:"site",sel:"#t-chatfab",title:"24/7 AI assistant",text:"Visitors ask questions any time of day. The assistant quotes typical prices, explains the process and collects the customer's details, which go straight into your pipeline.",pre:()=>{S.chat.open=false;renderChat();}},
 {mode:"site",sel:"#contact .contact",title:"Enquiry form",text:"A traditional quote form for customers who prefer it. Every submission lands in the portal instantly: no more lost emails."},
 {mode:"portal",view:"dashboard",sel:"#t-kpis",title:"The owner's dashboard",text:"Open pipeline, quotes waiting, jobs on site and money owed, all on one screen when you log in each morning."},
 {mode:"portal",view:"dashboard",sel:"#t-insights",title:"AI tells you what to do next",text:"It spots the quiet quotes, the finished jobs not yet invoiced and the late payers, and offers to deal with each in one click."},
 {mode:"portal",view:"enquiries",sel:"#t-kanban",title:"Enquiries pipeline",text:"Every lead from the website, AI chat, WhatsApp, phone and review sites. Drag a card to move it along. Open one to reply, book a visit or quote."},
 {mode:"portal",view:"import",sel:"#t-import",title:"WhatsApp to enquiry",text:"Paste a rambling WhatsApp chat and the AI extracts name, number, address, job, budget and urgency, then creates the enquiry for you."},
 {mode:"portal",view:"quotes",sel:"#t-wizard",title:"AI quote builder",text:"Four steps: pick the enquiry, let AI price it line by line from your price book, let AI write the scope and exclusions, then send a branded PDF and email.",pre:()=>{S.wiz=null;}},
 {mode:"portal",view:"followups",sel:"#t-followups",title:"Automatic follow-ups",text:"Quotes with no reply for a week get a chaser drafted automatically, getting firmer the longer it's been. Most builders never chase. This wins jobs."},
 {mode:"portal",view:"writer",sel:"#t-writer",title:"Writing assistant",text:"Replies, visit confirmations, running-late messages, payment reminders, review requests and weekly updates. Pick a tone, press one button."},
 {mode:"portal",view:"jobs",sel:"#t-jobs",title:"Jobs tracker",text:"Progress, crew, dates and the next task for every job. Mark a job complete and it's ready to invoice."},
 {mode:"portal",view:"calendar",sel:"#t-cal",title:"Calendar",text:"Site visits, job days, follow-ups, deliveries and inspections in one colour-coded diary. Bookings from the pipeline appear here automatically."},
 {mode:"portal",view:"invoices",sel:"#t-invgen",title:"AI invoicing",text:"Finished jobs become invoices in one click: the agreed quote, variations and deposits already paid are all worked out for you."},
 {mode:"portal",view:"content",sel:"#t-content",title:"Edit your own website",text:"Change the headline, wording and services without calling a developer. The AI suggests headlines too. That's the full tour!"}
];
let TI=-1;
function tourStart(){closeDrawer();tourGo(0);}
function tourEnd(){TI=-1;const o=$("#tourLayer");if(o)o.remove();window.removeEventListener("resize",tourPlace);window.removeEventListener("scroll",tourPlace,true);}
function tourGo(i){
 if(i<0)return; if(i>=TOUR.length){tourEnd();toast("Tour finished. Everything is clickable, so explore freely.");return;}
 TI=i;const s=TOUR[i];
 if(s.pre)s.pre();
 if(S.mode!==s.mode)setMode(s.mode);
 if(s.view&&S.view!==s.view)go(s.view);else if(s.view&&s.pre)renderView();
 let layer=$("#tourLayer");
 if(!layer){layer=document.createElement("div");layer.id="tourLayer";document.body.appendChild(layer);window.addEventListener("resize",tourPlace);window.addEventListener("scroll",tourPlace,true);}
 layer.innerHTML=`<div class="tour-block"></div><div class="tour-hl" id="tourHl"></div><div class="tour-tip" id="tourTip" role="dialog" aria-label="Guided tour"><span class="c">${i+1} / ${TOUR.length}</span><h3>${s.title}</h3><p>${s.text}</p><div class="nav"><button class="btn sm ghost" data-act="tour-end">Skip tour</button><span class="sp"></span>${i>0?'<button class="btn sm" data-act="tour-prev">Back</button>':""}<button class="btn sm primary" data-act="tour-next">${i===TOUR.length-1?"Finish":"Next"}</button></div></div>`;
 const t=$(s.sel);
 if(t){const r=t.getBoundingClientRect();const top=r.top+window.scrollY-120;window.scrollTo({top:Math.max(0,top),behavior:"auto"});}
 requestAnimationFrame(tourPlace);
 const nb=layer.querySelector('[data-act="tour-next"]');nb&&nb.focus({preventScroll:true});
}
function tourPlace(){
 if(TI<0)return;const s=TOUR[TI];const t=$(s.sel);const hl=$("#tourHl"),tip=$("#tourTip");if(!hl||!tip)return;
 const vw=window.innerWidth,vh=window.innerHeight;
 if(!t){hl.style.cssText="left:50%;top:50%;width:0;height:0";tip.style.left=Math.max(16,(vw-tip.offsetWidth)/2)+"px";tip.style.top=Math.max(16,(vh-tip.offsetHeight)/2)+"px";return;}
 const r=t.getBoundingClientRect();const pad=6;
 const top=Math.max(4,r.top-pad),left=Math.max(4,r.left-pad),w=Math.min(vw-8,r.width+pad*2),h=Math.min(vh-top-4,r.height+pad*2);
 hl.style.left=left+"px";hl.style.top=top+"px";hl.style.width=w+"px";hl.style.height=h+"px";
 const tw=tip.offsetWidth,th=tip.offsetHeight;let tx,ty;
 if(vw<640){tx=16;ty=vh-th-16;}
 else{
  if(top+h+12+th<vh){ty=top+h+12;}else if(top-12-th>60){ty=top-12-th;}else{ty=Math.min(vh-th-16,Math.max(70,top+20));}
  tx=Math.min(vw-tw-16,Math.max(16,left));
  if(r.height>vh*.55&&r.width<vw*.6){tx=left+w+14<vw-tw?left+w+14:Math.max(16,left-tw-14);ty=Math.max(70,Math.min(vh-th-16,top));}
 }
 tip.style.left=tx+"px";tip.style.top=ty+"px";
}

/* ---------- boot ---------- */
function start(){
 const h=(location.hash||"").slice(1);
 if(h&&VIEWS[h]){S.view=h;setMode("portal");}else if(h==="portal"){setMode("portal");}else setMode("site");
}
start();
})();
</script>

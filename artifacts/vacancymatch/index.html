<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Talent Matcher AI</title>
    <meta name="description" content="Talent Matcher AI helps specialist recruiters find better live vacancies, reduce recruiter noise, and track real employer demand by sector." />
    <meta name="robots" content="index, follow" />

    <meta property="og:title" content="Talent Matcher AI" />
    <meta property="og:description" content="Live vacancy intelligence and candidate matching for specialist recruiters across Insurance, Banking, Finance and Technology." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Talent Matcher AI" />
    <meta name="twitter:description" content="Live vacancy intelligence and candidate matching for specialist recruiters across Insurance, Banking, Finance and Technology." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get("theme");
          var t = q === "light" || q === "dark" ? q : localStorage.getItem("vm-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var d = document.documentElement;
          d.setAttribute("data-theme", t);
          d.classList.toggle("dark", t === "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

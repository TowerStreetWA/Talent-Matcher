kind = "web"
previewPath = "/"
title = "VacancyMatch AI"
version = "1.0.0"
id = "artifacts/vacancymatch"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18259

[services.development]
run = "pnpm --filter @workspace/vacancymatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vacancymatch", "run", "build" ]
publicDir = "artifacts/vacancymatch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18259"
BASE_PATH = "/"
